name: Python CI

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    name: Run automated tests
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}/src

    steps:
      - name: Download repository code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check code quality
        run: ruff check .

      - name: Check code formatting
        run: ruff format --check .

      - name: Run tests
        run: python -m pytest -v

  docker:
    name: Build and smoke-test Docker image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Download repository code
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t iris-api:ci .

      - name: Start Docker container
        run: |
          docker run -d \
            --name iris-api-test \
            -p 8000:8000 \
            iris-api:ci

      - name: Test health endpoint
        run: |
          for attempt in {1..10}; do
            if curl --fail http://127.0.0.1:8000/health; then
              exit 0
            fi

            echo "Waiting for API to start..."
            sleep 2
          done

          docker logs iris-api-test
          exit 1

      - name: Remove test container
        if: always()
        run: docker rm -f iris-api-test

  publish:
    name: Publish Docker image
    needs: docker

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ghcr.io/abirmetya/iris-api

    steps:
      - name: Download repository code
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
          docker login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Build versioned Docker image
        run: |
          docker build \
            --tag "$IMAGE_NAME:${{ github.sha }}" \
            --tag "$IMAGE_NAME:latest" \
            .

      - name: Publish Docker image
        run: |
          docker push "$IMAGE_NAME:${{ github.sha }}"
          docker push "$IMAGE_NAME:latest"